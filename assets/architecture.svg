<text x="410" y="560" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#b9cbc2">Every conversation is a lot. Its traveler records each station it passes.</text>
<text x="410" y="584" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#b9cbc2">Recipe (quality dial) and wiring live in HQ — change a file, not the code.</text>
<text x="410" y="620" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#8ff0bf">world run → approve → publish → push → hq</text>
