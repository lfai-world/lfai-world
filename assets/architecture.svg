<text x="58" y="388" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa79a">Claude · ChatGPT · Gemini</text>
<text x="58" y="410" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa79a">Grok · Perplexity · DeepSeek</text><text x="58" y="454" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa79a">Your own key, your own bill</text>
<text x="58" y="432" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa79a">Edits drafts at WC-03 / WC-04</text>
<rect x="40" y="510" width="300" height="150" rx="16" fill="#0c1a14" stroke="#e8c46a"/>
<text x="58" y="542" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffe7a6">Human gate</text>
<text x="58" y="568" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa79a">Approves at WC-04 Gate</text>
<text x="58" y="590" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa79a">world approve · world reject</text>
<text x="58" y="612" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa79a">Nothing ships without a person</text>
