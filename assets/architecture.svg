<rect width="1280" height="700" fill="url(#bg)"/>
<text x="40" y="52" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" letter-spacing="3" fill="#8ff0bf">LFAI WORLD · ARCHITECTURE</text>
<text x="40" y="88" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="#fff">Devices do the work. One GitHub account holds the factory. A person decides what ships.</text>
<rect x="40" y="130" width="300" height="170" rx="16" fill="#0c1a14" stroke="#1f3a2f"/>
<text x="58" y="162" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">Your devices</text>
<text x="58" y="188" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa79a">Android phone · laptop · mini PC</text>
<text x="58" y="210" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa79a">Capture app — one share tap</text>
<text x="58" y="232" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa79a">Engine: world run (no GPU)</text>
<text x="58" y="254" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#8aa79a">Originals & keys stay here</text>
